<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ahkiri - Nouveau mot de passe</title>
</head>

<body>

    <h1>Réinitialisation du mot de passe</h1>

    <input
        type="password"
        id="nouveau-password"
        placeholder="Nouveau mot de passe"
    >

    <button id="modifier-password">
        Modifier le mot de passe
    </button>

    <p id="message"></p>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
    const bouton = document.getElementById("modifier-password");
    const message = document.getElementById("message");

    async function verifierSession() {
        const { data, error } = await clientSupabase.auth.getSession();

        if (error) {
            console.error(error);
            message.textContent = "Erreur lors de la récupération de la session.";
            return;
        }

        if (!data.session) {
            message.textContent =
                "Lien de réinitialisation invalide ou expiré. Demande un nouveau lien.";
            bouton.disabled = true;
            return;
        }

        message.textContent = "Lien valide. Tu peux choisir un nouveau mot de passe.";
    }

    bouton.addEventListener("click", async function () {
        const nouveauPassword =
            document.getElementById("nouveau-password").value;

        if (nouveauPassword.length < 8) {
            message.textContent =
                "Choisis un mot de passe d'au moins 8 caractères.";
            return;
        }

        const { data, error } = await clientSupabase.auth.updateUser({
            password: nouveauPassword
        });

        if (error) {
            console.error("Erreur Supabase :", error);
            message.textContent =
                "Impossible de modifier le mot de passe : " + error.message;
            return;
        }

        message.textContent =
            "Mot de passe modifié avec succès ! Tu peux maintenant te connecter.";

        console.log(data);
    });

    verifierSession();
</script>

</body>

</html>
